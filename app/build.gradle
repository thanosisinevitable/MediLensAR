plugins { id 'com.android.application' }
android {
    namespace 'org.medilens'
    compileSdk 35
    defaultConfig {
        applicationId 'org.medilens.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0-preview'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation 'com.google.ar:core:1.48.0'
    // Bundled model: no first-use model download and no Play Services OCR provider.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
